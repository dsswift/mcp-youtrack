name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Users install with uvx, which resolves dependencies fresh on every install.
  # A weekly run catches an upstream release that breaks the server before a user does.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/
      - run: uv run pytest
